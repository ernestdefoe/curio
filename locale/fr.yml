      color: Couleur
      color_help: "Un code hexadécimal comme #5b3fd1. Laissez vide pour utiliser la couleur du forum."
      shape: Forme des jaquettes
      source: Recherches
      needs_marquee: La recherche de films et séries vient de Marquee, celle de jeux d'IGDB (à configurer dans les réglages ci-dessus) ou de Marquee. Tant qu'il n'est pas installé, les membres peuvent scanner des codes-barres ou ajouter des objets à la main.
      cards_help: "Gratuit, sans clé : Pokémon via TCGdex (dans la langue du lecteur quand il l'a), Magic via Scryfall, Yu-Gi-Oh! via YGOPRODeck. L'extension, le numéro, la rareté et la langue remplissent les détails de ces noms (set, number, rarity, language) quand le type les a."
