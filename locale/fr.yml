  admin:
    settings:
      upc_label: Clé UPCitemdb (facultatif)
      upc_help: "Le scan de codes-barres fonctionne sans aucune clé. Les livres sont cherchés sur Open Library et les disques sur Deezer et MusicBrainz. Les jeux, films et autres produits sont demandés à UPCitemdb (sans clé, 100 par jour, surtout les produits nord-américains) et à Open Icecat (sans clé, surtout les produits européens : jeux, consoles, électronique, jouets). Chaque code-barres trouvé par le forum, ou associé à la main par un membre, est gardé : il n’est jamais demandé deux fois. Une clé UPCitemdb payante ne fait que relever la limite quotidienne d’UPCitemdb ; la plupart des forums n’en ont jamais besoin."
      upc_link: Offres UPCitemdb
      barcodes_label: Scan et recherche de codes-barres
      barcodes_help: "Les membres peuvent scanner ou saisir un code-barres ou un ISBN pour trouver ce qu’ils ajoutent. Désactivé, le bouton Scanner disparaît, un nombre saisi dans la recherche est cherché comme un titre, et le forum n’interroge plus aucun service de codes-barres."
      barcodelookup_label: Clé API barcodelookup.com (facultatif, payant)
      barcodelookup_help: "Un service payant, interrogé après les services gratuits et avant eBay pour les codes-barres qu’ils ne connaissent pas. Les offres commencent vers 99 $ par mois pour 5 000 réponses ; une recherche sans résultat n’est pas comptée, et une clé de test gratuite est proposée sur la même page. Curio ne lit que le nom du produit (ses images et descriptions appartiennent à des tiers et ne sont jamais utilisées), garde un nom un jour, et interroge 200 fois par jour au plus, 25 par membre."
      barcodelookup_link: Offres et clé API barcodelookup.com
      eansearch_label: Jeton API EAN-Search.org (facultatif, payant)
      eansearch_help: "Une base payante d’environ 1,3 milliard de codes-barres, interrogée après barcodelookup.com et avant eBay. Les offres commencent vers 19 € par mois pour 5 000 requêtes, avec un mois d’essai à 1 € pour 100 (une fois par personne) ; chaque requête compte, trouvée ou non. Curio interroge dans la langue du forum, garde un nom un mois et un échec une semaine, et interroge 200 fois par jour au plus, 25 par membre. Votre jeton s’affiche dans votre compte EAN-Search après l’inscription."
      eansearch_link: Offres et inscription EAN-Search
      ebay_app_label: App ID eBay (Client ID) (facultatif)
      ebay_cert_label: Cert ID eBay (Client Secret)
      ebay_help: "Pour les codes-barres qu’UPCitemdb et Open Icecat ne connaissent pas, un compte développeur eBay gratuit permet à Curio de demander à eBay, qui liste presque tous les produits en boîte. Connectez-vous (ou inscrivez-vous au programme eBay Developers), ouvrez Application Keys et créez un jeu de clés Production (nom au choix). À côté du jeu de clés, ouvrez Notifications et, sous Marketplace Account Deletion, activez l’exemption « Not persisting eBay data » : Curio ne garde que le nom du produit lu et le code-barres, jamais les annonces, vendeurs ou acheteurs. Copiez ici l’App ID et le Cert ID. eBay est demandé en dernier, 1 000 fois par jour au plus ; ses photos ne sont pas utilisées."
      ebay_link: Ouvrir les Application Keys d’eBay
      ebay_market_label: Site eBay à interroger
      ebay_market_help: Le site eBay dont les annonces nomment le code-barres. Par défaut, il suit la langue du forum (français → eBay France, allemand → eBay Allemagne, anglais britannique → eBay Royaume-Uni, sinon eBay États-Unis).
      ebay_market_auto: Selon la langue du forum
      deepl_label: Clé DeepL (facultatif)
      deepl_help: Quand Wikipédia n'a pas de description dans une langue, DeepL traduit celle en anglais. Les clés gratuites finissent par « :fx ».
      deepl_link: Obtenir une clé
      max_upload_label: Photo la plus lourde (Ko)
      max_upload_help: Les photos sont réencodées en WebP et redimensionnées, ce qui est stocké est donc bien plus léger.
      layout_label: Présentation de la page Collections
      layout_help: Comment la page Collections montre chaque type.
      layout_tags: Comme la page des étiquettes (par défaut de Flarum)
      layout_covers: Tuiles de couvertures
      layout_compact: Onglets compacts (une rangée de petits boutons)
      type_color_label: Couleur des onglets compacts
      type_color_help: Avec les onglets compacts, la couleur de chaque type peut remplir son onglet ou seulement colorer son icône et son nom.
      type_color_background: En fond de l'onglet
      type_color_text: Sur l'icône et le nom seulement
      latest_label: Afficher « Derniers changements »
      latest_help: Une rangée sur la page Collections avec les derniers avancements indiqués par les membres (terminé, en cours…) et les dernières notes en étoiles qu’ils ont données, dans les collections que le lecteur peut voir.
      hide_empty_label: Masquer les types sans rien dedans
      hide_empty_help: Désactivé par défaut, la page Collections montre donc chaque type activé, comme la page des étiquettes montre chaque étiquette ; un type vide invite à lancer une première collection. Une fois activé, seuls les types qui contiennent quelque chose sont montrés (tous, tant que le forum n'a encore rien).
      cover_fit_label: Jaquettes qui ne remplissent pas le cadre
      cover_fit_help: "Chaque type a une forme de jaquette, pour que la grille d'une collection reste nette. Une jaquette d'une autre forme (une boîte de jeu 3:4 dans un cadre 2:3) peut être montrée entière sur une copie floutée d'elle-même, entière sur un fond uni, ou recadrée pour remplir le cadre. Un type dont la forme correspond à ses jaquettes (Portrait 3:4 pour les boîtes de jeu) n'en a pas besoin."
      cover_fit_blur: Entière sur un fond flouté
      cover_fit_plain: Entière sur un fond uni
      cover_fit_crop: Recadrée pour remplir le cadre
      shortcut_label: Raccourci « Mes collections »
      shortcut_help: Où les membres trouvent un lien vers leurs propres collections.
      shortcut_both: Barre latérale et menu du compte
      shortcut_sidebar: Barre latérale seulement
      shortcut_menu: Menu du compte seulement
      shortcut_none: Nulle part (Profil → Collections reste disponible)
      widget_label: Proposer le widget « Ajouts récents »
      widget_help: Désactivé par défaut. Une fois activé, le widget peut être placé avec Bespoke ou FoF Forum Widgets (il apparaît d'abord dans la colonne de droite de FoF ; déplacez-le ou retirez-le dans l'éditeur de FoF).
      widget_title: Ajouts récents aux collections
      igdb_id_label: Client ID IGDB (facultatif)
      igdb_secret_label: Client secret IGDB
      igdb_help: "Avec une application de développeur Twitch gratuite, la recherche de jeux passe par IGDB : jaquette, développeur, éditeur, date de sortie, plateformes et genres. Enregistrez une application (nom libre ; URL de redirection OAuth http://localhost ; catégorie Application Integration), puis copiez son Client ID et créez un nouveau secret. Sans cela, les jeux sont recherchés via Marquee s'il est installé."
      igdb_link: Créer une application Twitch
      igdb_docs: (instructions d'IGDB)
    types:
      heading: Types de collection
      help: Les membres choisissent un type pour chaque collection. Le type fixe la forme des jaquettes, les détails demandés et la source des recherches. Glissez pour changer l'ordre.
